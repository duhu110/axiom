<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent SSE Test</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 16px;
            background: #fafafa;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 380px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 480px;
            gap: 12px;
        }
        .panel {
            border: 1px solid #d6d6d6;
            border-radius: 8px;
            background: #fff;
            padding: 10px;
            overflow: hidden;
        }
        .panel h3 {
            margin: 0 0 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel h3 .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: #e0e0e0;
            color: #555;
        }
        #chat-box {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            background: #fff;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .config-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .config-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .config-row label {
            font-size: 12px;
            color: #555;
            min-width: 80px;
        }
        .config-row select,
        .config-row input {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 12px;
        }
        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            background: #e8f4fd;
            border: 1px solid #b3d9ff;
            border-radius: 6px;
        }
        .model-selector select {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid #9ac7ff;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
        }
        .model-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #ddd;
        }
        .model-badge.default {
            background: #e8f5e9;
            border-color: #81c784;
            color: #2e7d32;
        }
        .refresh-btn {
            padding: 4px 10px;
            font-size: 11px;
            border: 1px solid #9ac7ff;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background: #f0f7ff;
        }
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message { margin-bottom: 10px; }
        .user { color: #0b57d0; }
        .agent { color: #0f9d58; }

        .event-card {
            border: 1px solid #eee;
            border-left-width: 4px;
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            background: #fcfcfc;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12px;
            color: #333;
        }
        .event-header {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .event-chip {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 12px;
            background: #efefef;
            color: #222;
            font-size: 11px;
            line-height: 18px;
        }
        .event-json {
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 180px;
            overflow: auto;
            background: #f7f7f7;
            border-radius: 4px;
            padding: 6px;
            border: 1px solid #eee;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            font-size: 12px;
        }
        .stat {
            background: #f6f8ff;
            border: 1px solid #dfe5ff;
            border-radius: 6px;
            padding: 6px;
        }
        .stat .label { color: #666; font-size: 11px; }
        .stat .value { font-weight: 700; color: #1a237e; }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .toolbar input, .toolbar select, .toolbar button {
            font-size: 12px;
            padding: 5px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
        }

        .log-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            background: #f9f9f9;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .log-entry { border-bottom: 1px dashed #ddd; padding: 3px 0; }
        .log-time { color: #888; margin-right: 5px; }

        #event-feed {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            background: #fff;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-indicator.connected {
            background: #4caf50;
        }
        .status-indicator.disconnected {
            background: #f44336;
        }
        .status-indicator.loading {
            background: #ff9800;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #e0e0e0;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="margin: 0 0 10px;">Agent SSE Test</h1>

        <!-- 配置区域 -->
        <div class="config-area">
            <div class="config-row">
                <label>Access Token:</label>
                <input type="text" id="token" placeholder="Enter Access Token">
            </div>
            <div class="config-row">
                <label>Model:</label>
                <div class="model-selector" style="flex: 1;">
                    <span class="status-indicator" id="model-status"></span>
                    <select id="model-select">
                        <option value="">Loading models...</option>
                    </select>
                    <button class="refresh-btn" onclick="loadModels()" id="refresh-btn">↻</button>
                </div>
            </div>
            <div class="config-row" id="model-features" style="display: none; margin-top: 4px;">
                <label></label>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <span class="model-badge" id="feature-reasoning" style="display: none;">🧠 推理</span>
                    <span class="model-badge" id="feature-image" style="display: none;">🖼️ 图片</span>
                    <span class="model-badge" id="feature-file" style="display: none;">📁 文件</span>
                    <span class="model-badge" id="feature-batch" style="display: none;">📦 批处理</span>
                </div>
            </div>
        </div>

        <div id="chat-box"></div>

        <div class="input-area">
            <input type="text" id="query" placeholder="Type a message..." style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc;">
            <button onclick="sendMessage()" style="padding: 8px 16px; border-radius: 6px; border: 1px solid #ccc;">Send</button>
        </div>
    </div>

    <div class="right-panel">
        <div class="panel">
            <h3>
                Session & Metrics
                <span class="badge" id="connection-status">disconnected</span>
            </h3>
            <div id="session-info" style="margin-bottom: 8px; font-weight: bold; font-size: 12px;"></div>
            <div class="stats-grid" id="stats-grid"></div>
        </div>

        <div class="panel" style="display:flex; flex-direction:column; min-height: 220px;">
            <h3>Raw SSE Stream</h3>
            <div class="toolbar">
                <input id="filter-keyword" placeholder="Filter keyword (event/name/run_id)" />
                <select id="filter-type">
                    <option value="all">All types</option>
                    <option value="0">0:text</option>
                    <option value="2">2:reasoning</option>
                    <option value="9">9:tool_call</option>
                    <option value="a">a:tool_result</option>
                    <option value="r">r:retrieval</option>
                    <option value="e">e:raw_event</option>
                </select>
                <button onclick="clearLogs()">Clear logs</button>
            </div>
            <div class="log-box" id="logs"></div>
        </div>

        <div class="panel" style="display:flex; flex-direction:column; min-height: 280px;">
            <h3>Event Details</h3>
            <div id="event-feed"></div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const queryInput = document.getElementById('query');
        const tokenInput = document.getElementById('token');
        const logsContainer = document.getElementById('logs');
        const eventFeed = document.getElementById('event-feed');
        const statsGrid = document.getElementById('stats-grid');
        const modelSelect = document.getElementById('model-select');
        const modelStatus = document.getElementById('model-status');
        const refreshBtn = document.getElementById('refresh-btn');
        const connectionStatus = document.getElementById('connection-status');

        const state = {
            totalLines: 0,
            totalEvents: 0,
            textChunks: 0,
            reasoningChunks: 0,
            toolCalls: 0,
            toolResults: 0,
            rawEvents: 0,
            byEvent: {},
            parserBuffer: '',
            models: [],
            selectedModel: null,
        };

        const API_BASE = 'http://localhost:8000';

        function uuidv4() {
            return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
                (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> (+c / 4)).toString(16)
            );
        }

        const sessionId = uuidv4();
        document.getElementById('session-info').textContent = `Session ID: ${sessionId}`;

        // 加载模型列表
        async function loadModels() {
            const token = tokenInput.value.trim();

            modelStatus.className = 'status-indicator loading';
            modelSelect.disabled = true;
            refreshBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/llm/models`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token && { 'Authorization': `Bearer ${token}` }),
                    },
                });

                if (response.ok) {
                    const result = await response.json();
                    state.models = result.data?.items || [];
                    updateModelSelect();

                    modelStatus.className = 'status-indicator connected';
                    connectionStatus.textContent = 'models loaded';
                    connectionStatus.style.background = '#e8f5e9';
                    connectionStatus.style.color = '#2e7d32';
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                console.error('Failed to load models:', error);
                modelStatus.className = 'status-indicator disconnected';
                modelSelect.innerHTML = '<option value="">Failed to load models</option>';

                connectionStatus.textContent = 'models failed';
                connectionStatus.style.background = '#ffebee';
                connectionStatus.style.color = '#c62828';
            } finally {
                modelSelect.disabled = false;
                refreshBtn.disabled = false;
            }
        }

        // 更新模型选择器
        function updateModelSelect() {
            const currentValue = modelSelect.value;

            // 清空并填充选项
            modelSelect.innerHTML = '<option value="">使用默认模型</option>';

            state.models.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                const defaultMark = model.is_default ? ' [默认]' : '';
                option.textContent = `${model.model_name} (${model.provider})${defaultMark}`;
                option.dataset.model = JSON.stringify(model);
                modelSelect.appendChild(option);
            });

            // 恢复之前的选择
            if (currentValue && state.models.some(m => m.id === currentValue)) {
                modelSelect.value = currentValue;
            }

            updateModelFeatures();
        }

        // 更新模型特性显示
        function updateModelFeatures() {
            const selectedOption = modelSelect.selectedOptions[0];
            const featuresDiv = document.getElementById('model-features');

            if (!selectedOption || !selectedOption.value) {
                featuresDiv.style.display = 'none';
                return;
            }

            const model = JSON.parse(selectedOption.dataset.model);

            document.getElementById('feature-reasoning').style.display = model.support_reasoning ? 'inline' : 'none';
            document.getElementById('feature-image').style.display = model.support_image ? 'inline' : 'none';
            document.getElementById('feature-file').style.display = model.support_file ? 'inline' : 'none';
            document.getElementById('feature-batch').style.display = model.support_batch ? 'inline' : 'none';

            // 默认模型标记
            const badges = featuresDiv.querySelectorAll('.model-badge');
            badges.forEach(badge => {
                if (!badge.id.startsWith('feature-')) {
                    badge.remove();
                }
            });

            if (model.is_default) {
                const defaultBadge = document.createElement('span');
                defaultBadge.className = 'model-badge default';
                defaultBadge.textContent = '⭐ 默认模型';
                featuresDiv.querySelector('div').appendChild(defaultBadge);
            }

            featuresDiv.style.display = 'flex';
        }

        function eventColor(kind) {
            if (kind === 'on_tool_start') return '#1e88e5';
            if (kind === 'on_tool_end') return '#43a047';
            if (kind === 'on_chat_model_stream') return '#8e24aa';
            if (kind === 'on_chat_model_start' || kind === 'on_chat_model_end') return '#6d4c41';
            if (kind === 'on_retriever_start' || kind === 'on_retriever_end') return '#f4511e';
            if (kind === 'on_chain_start' || kind === 'on_chain_end') return '#3949ab';
            return '#757575';
        }

        function truncate(value, n = 240) {
            if (typeof value !== 'string') value = JSON.stringify(value, null, 2);
            if (value.length <= n) return value;
            return value.slice(0, n) + ' ...';
        }

        function toPrettyJson(value) {
            try {
                return JSON.stringify(value, null, 2);
            } catch {
                return String(value);
            }
        }

        function updateStats() {
            const byEventPairs = Object.entries(state.byEvent)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6)
                .map(([k, v]) => `<div><span class="label">${k}</span>: <span class="value">${v}</span></div>`)
                .join('');

            statsGrid.innerHTML = `
                <div class="stat"><div class="label">SSE lines</div><div class="value">${state.totalLines}</div></div>
                <div class="stat"><div class="label">Raw events (e)</div><div class="value">${state.rawEvents}</div></div>
                <div class="stat"><div class="label">Structured events</div><div class="value">${state.totalEvents}</div></div>
                <div class="stat"><div class="label">Text chunks (0)</div><div class="value">${state.textChunks}</div></div>
                <div class="stat"><div class="label">Reasoning chunks (2)</div><div class="value">${state.reasoningChunks}</div></div>
                <div class="stat"><div class="label">Tool start/end</div><div class="value">${state.toolCalls}/${state.toolResults}</div></div>
                <div class="stat"><div class="label">Retrieval (r)</div><div class="value">${state.retrievalResults || 0}</div></div>
                <div class="stat" style="grid-column: 1 / -1;">
                    <div class="label">Top LangGraph event types</div>
                    <div style="margin-top:4px;">${byEventPairs || '<span style="color:#888;">No events yet</span>'}</div>
                </div>
            `;
        }

        function matchesFilter(text, typeCode) {
            const keyword = document.getElementById('filter-keyword').value.trim().toLowerCase();
            const typeFilter = document.getElementById('filter-type').value;
            if (typeFilter !== 'all' && typeCode !== typeFilter) return false;
            if (!keyword) return true;
            return text.toLowerCase().includes(keyword);
        }

        function addLog(typeCode, text) {
            state.totalLines += 1;
            updateStats();

            if (!matchesFilter(text, typeCode)) return;

            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();

            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = `[${time}] `;
            entry.appendChild(timeSpan);

            const contentSpan = document.createElement('span');
            if (typeCode === '2') contentSpan.style.color = '#8e24aa';
            else if (typeCode === '0') contentSpan.style.color = '#2e7d32';
            else if (typeCode === '9') contentSpan.style.color = '#1565c0';
            else if (typeCode === 'a') contentSpan.style.color = '#ef6c00';
            else if (typeCode === 'e') contentSpan.style.color = '#555';
            else if (typeCode === 'i') contentSpan.style.color = '#888';
            else if (typeCode === '!') contentSpan.style.color = '#f44336';
            contentSpan.textContent = `${typeCode}:${text}`;
            entry.appendChild(contentSpan);

            logsContainer.appendChild(entry);
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        function addStructuredEvent(rawEvent) {
            state.totalEvents += 1;
            state.rawEvents += 1;
            const kind = rawEvent?.event || 'unknown';
            state.byEvent[kind] = (state.byEvent[kind] || 0) + 1;
            updateStats();

            const card = document.createElement('div');
            card.className = 'event-card';
            card.style.borderLeftColor = eventColor(kind);

            const header = document.createElement('div');
            header.className = 'event-header';
            header.innerHTML = `
                <span class="event-chip">event: ${rawEvent.event || '-'}</span>
                <span class="event-chip">name: ${rawEvent.name || '-'}</span>
                <span class="event-chip">run: ${rawEvent.run_id || '-'}</span>
                <span class="event-chip">parents: ${(rawEvent.parent_ids || []).length}</span>
            `;
            card.appendChild(header);

            if (rawEvent.chunk_snapshot) {
                const chunk = document.createElement('div');
                chunk.style.marginBottom = '6px';
                chunk.innerHTML = `<strong>chunk_snapshot:</strong> ${truncate(rawEvent.chunk_snapshot, 300)}`;
                card.appendChild(chunk);
            }

            if (rawEvent.metadata) {
                const meta = document.createElement('details');
                meta.innerHTML = `<summary><strong>metadata</strong></summary><div class="event-json">${toPrettyJson(rawEvent.metadata)}</div>`;
                card.appendChild(meta);
            }

            if (rawEvent.data !== undefined) {
                const data = document.createElement('details');
                data.innerHTML = `<summary><strong>data</strong></summary><div class="event-json">${toPrettyJson(rawEvent.data)}</div>`;
                card.appendChild(data);
            }

            const raw = document.createElement('details');
            raw.innerHTML = `<summary><strong>raw event (full)</strong></summary><div class="event-json">${toPrettyJson(rawEvent.raw || rawEvent)}</div>`;
            card.appendChild(raw);

            eventFeed.appendChild(card);
            eventFeed.scrollTop = eventFeed.scrollHeight;
        }

        function clearLogs() {
            logsContainer.innerHTML = '';
            eventFeed.innerHTML = '';
            state.totalLines = 0;
            state.totalEvents = 0;
            state.textChunks = 0;
            state.reasoningChunks = 0;
            state.toolCalls = 0;
            state.toolResults = 0;
            state.rawEvents = 0;
            state.byEvent = {};
            state.parserBuffer = '';
            updateStats();
        }

        function processSseLine(line, agentDiv) {
            if (!line) return;
            const typeCode = line[0];
            if (line[1] !== ':') return;
            const payloadText = line.slice(2);

            addLog(typeCode, payloadText);

            if (typeCode === '0') {
                state.textChunks += 1;
                updateStats();
                try {
                    const text = JSON.parse(payloadText);
                    // 使用 appendChild 而不是 textContent，避免覆盖子元素
                    const textSpan = document.createElement('span');
                    textSpan.textContent = text;
                    agentDiv.appendChild(textSpan);
                } catch (e) {
                    console.error('Error parsing text JSON:', e);
                }
                return;
            }

            if (typeCode === '2') {
                state.reasoningChunks += 1;
                updateStats();
                try {
                    const reasoning = JSON.parse(payloadText);
                    const reasoningSpan = document.createElement('span');
                    reasoningSpan.style.color = '#6a1b9a';
                    reasoningSpan.style.fontStyle = 'italic';
                    reasoningSpan.textContent = reasoning;
                    agentDiv.appendChild(reasoningSpan);
                } catch (e) {
                    console.error('Error parsing reasoning JSON:', e);
                }
                return;
            }

            if (typeCode === '9') {
                state.toolCalls += 1;
                updateStats();
                try {
                    JSON.parse(payloadText);
                } catch (e) {
                    console.error('Error parsing tool call JSON:', e);
                }
                return;
            }

            if (typeCode === 'a') {
                state.toolResults += 1;
                updateStats();
                try {
                    JSON.parse(payloadText);
                } catch (e) {
                    console.error('Error parsing tool result JSON:', e);
                }
                return;
            }

            if (typeCode === 'r') {
                state.retrievalResults = (state.retrievalResults || 0) + 1;
                updateStats();
                console.log('Processing retrieval event...');
                try {
                    const retrievalData = JSON.parse(payloadText);
                    const docs = retrievalData.documents || [];
                    console.log('Retrieval data:', docs.length, 'documents');

                    // 在 Agent 消息后添加检索来源显示
                    const retrievalDiv = document.createElement('div');
                    retrievalDiv.className = 'retrieval-sources';
                    retrievalDiv.style.marginTop = '8px';
                    retrievalDiv.style.padding = '8px';
                    retrievalDiv.style.backgroundColor = '#f0f7ff';
                    retrievalDiv.style.borderRadius = '4px';
                    retrievalDiv.style.fontSize = '12px';

                    const sourcesTitle = document.createElement('div');
                    sourcesTitle.style.fontWeight = 'bold';
                    sourcesTitle.style.color = '#1976d2';
                    sourcesTitle.style.marginBottom = '4px';
                    sourcesTitle.textContent = `📚 检索到 ${docs.length} 个文档来源:`;
                    retrievalDiv.appendChild(sourcesTitle);

                    docs.forEach((doc, idx) => {
                        const docDiv = document.createElement('div');
                        docDiv.style.marginLeft = '12px';
                        docDiv.style.marginBottom = '4px';
                        docDiv.style.color = '#424242';

                        const meta = doc.metadata || {};
                        const source = meta.source || 'N/A';
                        const page = meta.page || '';
                        const contentPreview = doc.content ? doc.content.substring(0, 60) + '...' : '';

                        docDiv.textContent = `${idx + 1}. [${source}${page ? ', p.' + page : ''}] ${contentPreview}`;
                        retrievalDiv.appendChild(docDiv);
                    });

                    agentDiv.appendChild(retrievalDiv);
                    console.log('Retrieval div appended, children count:', agentDiv.children.length);
                } catch (e) {
                    console.error('Error parsing retrieval result JSON:', e);
                }
                return;
            }

            if (typeCode === 'e') {
                try {
                    const rawEvent = JSON.parse(payloadText);
                    addStructuredEvent(rawEvent);
                } catch (e) {
                    console.error('Error parsing raw event JSON:', e);
                }
            }
        }

        async function sendMessage() {
            const query = queryInput.value.trim();
            const token = tokenInput.value.trim();
            const modelId = modelSelect.value;

            if (!query) return;

            if (!token) {
                alert('Please enter an access token.');
                return;
            }

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.textContent = 'User: ' + query;
            chatBox.appendChild(userDiv);
            queryInput.value = '';

            const agentDiv = document.createElement('div');
            agentDiv.className = 'message agent';

            // 显示当前使用的模型 - 使用 span 而不是 textContent
            const prefixSpan = document.createElement('span');
            const selectedOption = modelSelect.selectedOptions[0];
            const modelInfo = selectedOption && selectedOption.value
                ? ` [Model: ${selectedOption.textContent.split('(')[0].trim()}]`
                : ' [Model: 默认]';
            prefixSpan.textContent = 'Agent:' + modelInfo;
            agentDiv.appendChild(prefixSpan);
            chatBox.appendChild(agentDiv);

            addLog('i', `>> sending query=${query}, model_id=${modelId || '(default)'}`);

            try {
                const requestBody = {
                    query,
                    chat_history: [],
                    session_id: sessionId,
                };

                // 只有选择了具体模型时才添加 model_id
                if (modelId) {
                    requestBody.model_id = modelId;
                }

                const response = await fetch(`${API_BASE}/agent/chat/stream`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify(requestBody),
                });

                if (!response.ok || !response.body) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    state.parserBuffer += decoder.decode(value, { stream: true });
                    const lines = state.parserBuffer.split('\n');
                    state.parserBuffer = lines.pop() || '';

                    for (const rawLine of lines) {
                        const line = rawLine.trim();
                        processSseLine(line, agentDiv);
                    }

                    chatBox.scrollTop = chatBox.scrollHeight;
                }

                if (state.parserBuffer.trim()) {
                    processSseLine(state.parserBuffer.trim(), agentDiv);
                    state.parserBuffer = '';
                }

                addLog('i', '<< stream finished');
            } catch (error) {
                console.error('Error:', error);
                agentDiv.textContent += ' [Error: ' + error.message + ']';
                addLog('!', `error: ${error.message}`);
            }
        }

        // 监听模型选择变化
        modelSelect.addEventListener('change', updateModelFeatures);

        // 监听 token 输入，自动加载模型
        let tokenLoadTimer;
        tokenInput.addEventListener('input', () => {
            clearTimeout(tokenLoadTimer);
            tokenLoadTimer = setTimeout(() => {
                if (tokenInput.value.trim()) {
                    loadModels();
                }
            }, 800);
        });

        queryInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.getElementById('filter-keyword').addEventListener('input', () => {
            // New logs will follow filter; we keep existing logs untouched for now.
        });
        document.getElementById('filter-type').addEventListener('change', () => {
            // New logs will follow filter; we keep existing logs untouched for now.
        });

        // 初始加载统计数据
        updateStats();

        // 如果有缓存的 token，自动加载模型
        const cachedToken = localStorage.getItem('axiom_token');
        if (cachedToken) {
            tokenInput.value = cachedToken;
            loadModels();
        }

        // 保存 token 到 localStorage
        tokenInput.addEventListener('change', () => {
            localStorage.setItem('axiom_token', tokenInput.value.trim());
        });
    </script>
</body>
</html>
